syntax = "proto3";
package ET;

message RouterSync
{
	uint32 ConnectId = 1;
	string Address = 2;
}

// ResponseType M2C_TestResponse
message C2M_TestRequest // ILocationRequest
{
	int32 RpcId = 1;
	string request = 2;
}

message M2C_TestResponse // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	string response = 4;
}

// ResponseType G2C_EnterMap
message C2G_EnterMap // ISessionRequest
{
	int32 RpcId = 1;
	int32 ZoneId = 2;
}

message G2C_EnterMap // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	/// 自己的UnitId
	int64 UnitId = 4;
}

message MoveInfo
{
	repeated Unity.Mathematics.float3 Points = 1;
	Unity.Mathematics.quaternion Rotation = 2;
	int32 TurnSpeed = 3;
}

message UnitInfo
{
	int64 UnitId = 1;
	int32 ConfigId = 2;
	int32 Type = 3;
	Unity.Mathematics.float3 Position = 4;
	Unity.Mathematics.float3 Forward = 5;
	map<int32, int64> KV = 6;
	MoveInfo MoveInfo = 7;
	int32 ZoneId = 8;
	int32 Sex = 9;
    string NickName = 10;
    string Avatar = 11; 
    int32 Level = 12;
    int64 LastLoginTime = 13;
}

message M2C_CreateUnits // IMessage
{
	repeated UnitInfo Units = 1;
}

message M2C_CreateMyUnit // IMessage
{
	UnitInfo Unit = 1;
}

message M2C_StartSceneChange // IMessage
{
	int64 SceneInstanceId = 1;
	string SceneName = 2;
}

message M2C_RemoveUnits // IMessage
{
	repeated int64 Units = 1;
}

message C2M_PathfindingResult // ILocationMessage
{
	int32 RpcId = 1;
	Unity.Mathematics.float3 Position = 2;
}

message C2M_Stop // ILocationMessage
{
	int32 RpcId = 1;
}

message M2C_PathfindingResult // IMessage
{
	int64 Id = 1;
	Unity.Mathematics.float3 Position = 2;
	repeated Unity.Mathematics.float3 Points = 3;
}

message M2C_Stop // IMessage
{
	int32 Error = 1;
	int64 Id = 2;
	Unity.Mathematics.float3 Position = 3;
	Unity.Mathematics.quaternion Rotation = 4;
}

// ResponseType G2C_Ping
message C2G_Ping // ISessionRequest
{
	int32 RpcId = 1;
}

message G2C_Ping // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int64 Time = 4;
}


message G2C_Test // ISessionMessage
{
}

// ResponseType M2C_Reload
message C2M_Reload // ISessionRequest
{
	int32 RpcId = 1;
	string Account = 2;
	string Password = 3;
}

message M2C_Reload // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ResponseType R2C_Login
message C2R_Login // ISessionRequest
{
	int32 RpcId = 1;
	string  Account = 2;  // 帐号
	string  Password = 3;  // 密码
	int32 ZoneId = 4;      // 选择的区服ID
	string Platform = 5;   // 平台: iOS/Android/PC
	string Channel = 6;    // 渠道: WeChat/QQ/AppStore
	string SubChannel = 7; // 子渠道
}

message R2C_Login // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	string Address = 4;
	int64 Key = 5;
	int64 GateId = 6;
}



// ResponseType R2C_SDKLogin
message C2R_SDKLogin // ISessionRequest
{
	int32 RpcId = 1;
  	string UserId = 2; //用户ID
	string Token = 3;  // Token
	string Platform = 4;   // 平台: iOS/Android/PC
	string Channel = 5;    // 渠道: WeChat/QQ/AppStore
	string SubChannel = 6; // 子渠道
}

message R2C_SDKLogin // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ResponseType G2C_LoginGate
message C2G_LoginGate // ISessionRequest
{
	int32 RpcId = 1;
	int64 Key = 2;  // 帐号
	int64 GateId = 3;
	int32 ZoneId = 4;
}

message G2C_LoginGate // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int64 PlayerId = 4;
}

message G2C_KickOut // IMessage
{
    int32 Reason = 1;   // 0=账号在其他设备登录 1=服务器维护 2=封禁 3=其他
	int64 EndTime = 2;   // 截止时间
}

message G2C_TestHotfixMessage // ISessionMessage
{
	string Info = 1;
}

// ResponseType M2C_TestRobotCase
message C2M_TestRobotCase // ILocationRequest
{
	int32 RpcId = 1;
	int32 N = 2;
}

message M2C_TestRobotCase // ILocationResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int32 N = 4;
}

message C2M_TestRobotCase2 // ILocationMessage
{
	int32 RpcId = 1;
	int32 N = 2;
}

message M2C_TestRobotCase2 // ILocationMessage
{
	int32 RpcId = 1;
	int32 N = 2;
}

// ResponseType M2C_TransferMap
message C2M_TransferMap // ILocationRequest
{
	int32 RpcId = 1;
}

message M2C_TransferMap // ILocationResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ResponseType G2C_Benchmark
message C2G_Benchmark // ISessionRequest
{
	int32 RpcId = 1;
}

message G2C_Benchmark // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}





// 服务器列表信息
message ServerInfo
{
	int32 ZoneId = 1;       // 区服ID
	string GroupName = 2;   // 分组名称
	string ServerName = 3;  // 服务器名称
	string ServerDesc = 4;  // 服务器描述
	int32 Status = 5;       //服务器状态 0=正常, 1=禁止注册, 2=维护
  	int32 Load = 6;  //负载状态：0=流畅，1=繁忙，2=爆满
  	bool  IsNewZone = 7;//是否是新服
  	int32  RecommendWeight  = 8;//推荐权重，0不推荐，越大越推荐
	int64 OpenTime = 9; //开服时间
}

// ResponseType R2C_GetServerList
message C2R_GetServerList // ISessionRequest
{
	int32 RpcId = 1;
	string Account = 2;  // 帐号
	string Platform = 3;   // 平台: iOS/Android/PC
	string Channel = 4;    // 渠道: WeChat/QQ/AppStore
	string SubChannel = 5; // 子渠道
}

message R2C_GetServerList // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	repeated ServerInfo ServerList = 4;
  	repeated UnitInfo UnitInfoList = 5;
}

// ResponseType G2C_CreateUnit
message C2G_CreateUnit // ISessionRequest
{
	int32 RpcId = 1;
	int32 ZoneId = 2;
	int32 Sex = 3; //性别
	string NickName = 4;   // 角色名
	string Avatar = 5; // 头像外观
}

message G2C_CreateUnit // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int64 UnitId = 4; //角色ID
}

// ResponseType G2C_RandomNickName
message C2G_RandomNickName // ISessionRequest
{
	int32 RpcId = 1;
	int32 Sex = 2;   // 0不限 1男 2女
}

message G2C_RandomNickName // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	string NickName = 4; //随机昵称
}